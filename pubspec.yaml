name: yaqu_box
description: Food delivery app with QR scanner and multi-store support
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^2.24.0
  firebase_auth: ^4.14.0
  firebase_database: ^10.1.0
  cloud_firestore: ^4.13.0
  firebase_storage: ^11.5.0
  qr_code_scanner: ^1.0.1
  qr_flutter: ^4.1.0
  provider: ^6.1.0
  google_maps_flutter: ^2.5.0
  geolocator: ^9.0.2
  intl: ^0.19.0
  image_picker: ^1.0.4
  cached_network_image: ^3.3.0
  http: ^1.1.0
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/logos/